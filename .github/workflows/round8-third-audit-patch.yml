name: File04 third audit round8 patch
on:
  push:
    branches:
      - audit-file-04-third-ten-round-hardening
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: audit-file-04-third-ten-round-hardening
          fetch-depth: 0
      - shell: bash
        run: |
          python3 tools/round8-third-audit-patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Round 8 fix: fail closed on mapping evidence encoding errors"
          git push origin HEAD:audit-file-04-third-ten-round-hardening
