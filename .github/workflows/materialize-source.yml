name: Materialize File 04 Source

on:
  push:
    branches:
      - codex/file-04-forty-round-review-v120

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: true
      - name: Replace bootstrap payload with exact non-workflow source
        run: |
          set -euo pipefail
          cat .sync/part-* | base64 --decode > /tmp/file04-source.tar.xz
          test "$(sha256sum /tmp/file04-source.tar.xz | awk '{print $1}')" = "007108abbd70efceadf050a5153e0d58a119de9197883e0f446ca260b5dd0552"
          mkdir /tmp/file04-source
          tar -xJf /tmp/file04-source.tar.xz -C /tmp/file04-source
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          find .github -mindepth 1 -maxdepth 1 ! -name workflows -exec rm -rf {} +
          find .github/workflows -mindepth 1 -maxdepth 1 ! -name materialize-source.yml -exec rm -rf {} +
          find /tmp/file04-source -mindepth 1 -maxdepth 1 ! -name .github -exec cp -a {} . \;
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Materialize File 04 v1.2.0 reviewed source"
          git push origin HEAD
