name: File04 round9 minimal patch
on:
  push:
    branches:
      - audit/file-04-second-ten-round-hardening
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: audit/file-04-second-ten-round-hardening
          fetch-depth: 0
      - name: Align v2.0.2 QA, builder and CI
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/2\.0\.1/2.0.2/g' \
            tests/run-architecture.py \
            tests/run-central-reviews.py \
            tests/run-future18.py \
            tests/run-future18-reviews.py \
            tests/run-ten-round-post-future18.py \
            tools/build-release.py \
            .github/workflows/file04-legacy-adapter-ci.yml
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/build-release.py'); s=p.read_text()
          if 'SECOND_TEN_ROUND_REVIEW_ROUNDS=10' not in s:
              s=s.replace('TEN_ROUND_REVIEW_ROUNDS=10\nHISTORICAL_REVIEW_ROUNDS=40','TEN_ROUND_REVIEW_ROUNDS=10\nSECOND_TEN_ROUND_REVIEW_ROUNDS=10\nHISTORICAL_REVIEW_ROUNDS=40',1)
          gate="subprocess.run([sys.executable,str(ROOT/'tests/run-second-ten-round-hardening.py')],check=True,cwd=ROOT,stdout=subprocess.DEVNULL)"
          if gate not in s:
              anchor="subprocess.run([sys.executable,str(ROOT/'tests/run-ten-round-post-future18.py')],check=True,cwd=ROOT,stdout=subprocess.DEVNULL)"
              s=s.replace(anchor,anchor+'\n    '+gate,1)
          if "'second_ten_round_hardening'" not in s:
              anchor="'post_future18_hardening':{'version':'1.0.0','review_rounds':TEN_ROUND_REVIEW_ROUNDS,'gate':'tests/run-ten-round-post-future18.py','scope':'authorization, REST failures, visual/redirect/DR evidence, receipt authenticity, release consistency'},"
              addition=anchor+"\n          'second_ten_round_hardening':{'version':'1.0.0','review_rounds':SECOND_TEN_ROUND_REVIEW_ROUNDS,'gate':'tests/run-second-ten-round-hardening.py','audit':'SECOND-TEN-ROUND-HARDENING-AUDIT.md','scope':'second fresh fail-closed/security/reliability review'},"
              s=s.replace(anchor,addition,1)
          s=s.replace("'coded':'v2.0.2 post-Future18 hardened candidate'","'coded':'v2.0.2 second-ten-round hardened candidate'")
          p.write_text(s)

          p=Path('.github/workflows/file04-legacy-adapter-ci.yml'); w=p.read_text()
          if 'Second fresh ten-round hardening gate' not in w:
              w=w.replace('      - name: Deterministic release evidence\n','      - name: Second fresh ten-round hardening gate\n        run: python3 tests/run-second-ten-round-hardening.py\n      - name: Deterministic release evidence\n',1)
          if 'Second fresh ten-round hardening checks' not in w:
              w=w.rstrip()+'\n      - name: Second fresh ten-round hardening checks\n        run: python3 tests/run-second-ten-round-hardening.py\n'
          p.write_text(w)
          PY
          rm -f tools/round9-selfpatch.py .github/workflows/round9-selfpatch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Review 9 fix: integrate v2.0.2 second-audit release QA"
          git push origin HEAD:audit/file-04-second-ten-round-hardening
