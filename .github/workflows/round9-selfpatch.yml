name: File04 round9 self patch
on:
  push:
    branches:
      - audit/file-04-second-ten-round-hardening
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: audit/file-04-second-ten-round-hardening
          fetch-depth: 0
      - name: Apply patch with visible diagnostics
        shell: bash
        run: |
          if [ ! -f tools/round9-selfpatch.py ]; then exit 0; fi
          set +e
          python3 tools/round9-selfpatch.py > /tmp/round9.log 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            msg=$(tail -n 8 /tmp/round9.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
            echo "::error file=tools/round9-selfpatch.py::$msg"
            exit "$code"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Review 9 fix: integrate second ten-round hardening as v2.0.2"
          git push origin HEAD:audit/file-04-second-ten-round-hardening
