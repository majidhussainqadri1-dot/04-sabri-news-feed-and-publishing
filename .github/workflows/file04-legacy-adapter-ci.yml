name: File 04 Legacy Adapter — Central Plan + Future18 + Two-Eighty-Round Hardening CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/file-04-*'
      - 'audit/file-04-*'
      - 'audit-file-04-*'

permissions:
  contents: read

jobs:
  integrity-and-architecture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: File 04 architecture and canonical ownership
        run: python3 tests/run-architecture.py
      - name: File 04 own-plan FR/NFR completion
        run: python3 tests/run-file04-own-plan.py
      - name: Modern central-plan requirement trace
        run: php tests/run-central-plan.php
      - name: Future18 source completion
        run: python3 tests/run-future18.py
      - name: Two post-central-plan review-fix-retest rounds
        run: python3 tests/run-central-reviews.py
      - name: Two fresh Future18 review-fix-retest rounds
        run: python3 tests/run-future18-reviews.py
      - name: Historical first ten-round post-Future18 hardening gate
        run: python3 tests/run-ten-round-post-future18.py
      - name: Second fresh ten-round hardening gate
        run: python3 tests/run-second-ten-round-hardening.py
      - name: Third fresh ten-round hardening gate
        run: python3 tests/run-third-ten-round-hardening.py
      - name: Historical first eighty-round hardening gate
        run: python3 tests/run-eighty-round-hardening.py
      - name: Second fresh eighty-round hardening gate
        run: python3 tests/run-second-eighty-round-hardening.py
      - name: Deterministic release evidence
        run: python3 tools/build-release.py --verify-only
      - name: Secret and personal-data indicator scan
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,sys
          patterns={
            'private key':rb'-----BEGIN (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----',
            'GitHub token':rb'\bgh[pousr]_[A-Za-z0-9]{20,}\b',
            'Google API key':rb'\bAIza[0-9A-Za-z_-]{35}\b',
            'AWS access key':rb'\bAKIA[0-9A-Z]{16}\b',
            'Pakistan CNIC':rb'(?<![0-9])[0-9]{5}-[0-9]{7}-[0-9](?![0-9])',
            'Pakistan phone':rb'(?<![0-9])(?:\+92|0092)3[0-9]{9}(?![0-9])',
          }
          forbidden={'.env','wp-config.php','id_rsa','id_ed25519','credentials.json'}
          for p in Path('.').rglob('*'):
            if not p.is_file() or '.git' in p.parts: continue
            if p.name in forbidden or p.suffix.lower() in {'.zip','.sql','.sqlite','.pem','.p12','.pfx'}:
              print('Forbidden file:',p);sys.exit(1)
            data=p.read_bytes()
            for label,pat in patterns.items():
              if re.search(pat,data): print('Possible',label,'in',p);sys.exit(1)
          print('Credential and personal-data indicator scan passed.')
          PY
      - name: Reproducible v2.0.7 package twice
        run: |
          python3 tools/build-release.py --output /tmp/file04-a.zip --source-output /tmp/file04-source-a.zip > /tmp/a.json
          python3 tools/build-release.py --output /tmp/file04-b.zip --source-output /tmp/file04-source-b.zip > /tmp/b.json
          cmp /tmp/file04-a.zip /tmp/file04-b.zip
          cmp /tmp/file04-source-a.zip /tmp/file04-source-b.zip
          cat /tmp/a.json
          sha256sum /tmp/file04-a.zip /tmp/file04-source-a.zip

