name: File04 eighty-round R51-R64 corrective self-patch

on:
  push:
    branches:
      - audit-file-04-eighty-round-hardening

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: audit-file-04-eighty-round-hardening
          persist-credentials: true
      - name: Apply and lint R51-R64 corrections
        id: patch
        shell: bash
        run: |
          set +e
          python3 -m py_compile tools/apply-eighty-round-r51-r64.py
          python3 tools/apply-eighty-round-r51-r64.py > /tmp/r51-r64.log 2>&1
          patch_rc=$?
          cat /tmp/r51-r64.log
          lint_rc=0
          if [ "$patch_rc" -eq 0 ]; then
            while IFS= read -r -d '' file; do
              php -l "$file" >> /tmp/r51-r64.log 2>&1 || lint_rc=1
            done < <(find includes -name '*.php' -print0)
          fi
          if [ "$patch_rc" -ne 0 ] || [ "$lint_rc" -ne 0 ]; then
            cp /tmp/r51-r64.log EIGHTY-R51-R64-DIAGNOSTIC.txt
            git checkout -- includes
            echo 'failed=true' >> "$GITHUB_OUTPUT"
          else
            rm -f EIGHTY-R51-R64-DIAGNOSTIC.txt
            echo 'failed=false' >> "$GITHUB_OUTPUT"
          fi
          exit 0
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ "${{ steps.patch.outputs.failed }}" = "true" ]; then
            git add EIGHTY-R51-R64-DIAGNOSTIC.txt
            git commit -m '80-round audit: record R51-R64 patch diagnostic'
          else
            git add -A includes EIGHTY-R51-R64-DIAGNOSTIC.txt
            git commit -m 'File 04 v2.0.4: correct defects from 80-round audit R51-R64'
          fi
          git push origin HEAD:audit-file-04-eighty-round-hardening
