name: Corrective Integrity Diagnostic

on:
  pull_request:
  push:
    branches:
      - audit/file-04-source-review

permissions:
  contents: read

jobs:
  inventory-diagnostic:
    name: Print actual corrective inventory
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout immutable action
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Print actual source identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('.')
          paths=[]
          for line in (root/'CORRECTIVE-SOURCE-INVENTORY.tsv').read_text().splitlines()[1:]:
              parts=line.split('\t',2)
              if len(parts)==3:
                  paths.append(parts[2])
          rows=[]
          total=0
          php=0
          print('ACTUAL_INVENTORY_BEGIN')
          print('sha256\tbytes\tpath')
          for p in sorted(paths):
              data=(root/p).read_bytes()
              h=hashlib.sha256(data).hexdigest()
              s=len(data)
              rows.append(f'{h}\t{s}\t{p}\n')
              total+=s
              php+=p.endswith('.php')
              print(f'{h}\t{s}\t{p}')
          tree=hashlib.sha256(''.join(rows).encode()).hexdigest()
          print('ACTUAL_INVENTORY_END')
          print(f'ACTUAL_SOURCE_COUNT={len(rows)}')
          print(f'ACTUAL_PHP_COUNT={php}')
          print(f'ACTUAL_SOURCE_SIZE={total}')
          print(f'ACTUAL_SOURCE_TREE_SHA256={tree}')
          PY
