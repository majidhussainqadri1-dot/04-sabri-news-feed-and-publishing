name: File04 round3 self patch
on:
  push:
    branches:
      - audit/file-04-second-ten-round-hardening
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: audit/file-04-second-ten-round-hardening
          fetch-depth: 0
      - name: Apply patch when script exists
        shell: bash
        run: |
          if [ ! -f tools/round3-selfpatch.py ]; then exit 0; fi
          python3 tools/round3-selfpatch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Review 3 fix: block mutations on invalid lifecycle state"
          git push origin HEAD:audit/file-04-second-ten-round-hardening
