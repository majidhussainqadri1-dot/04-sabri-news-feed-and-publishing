name: File04 Future18 inherited QA cleanup

on:
  push:
    branches: ['codex/file-04-future18-v200']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/file-04-future18-v200
          persist-credentials: true
      - name: Align inherited assertions and release truth
        run: |
          sed -i "s/VERSION='1.3.0'/VERSION='2.0.0'/g" tests/run-file04-own-plan.py
          sed -i "s/'coded':'v1.3.0 candidate'/'coded':'v2.0.0 Future18 candidate'/g" tools/build-release.py
          rm -f .github/workflows/file04-future18-testcompat-patch.yml
          rm -f .github/workflows/file04-future18-simple-patch.yml
      - name: Commit cleanup
        run: |
          git config user.name "Sabri File 04 Future18 Reconciler"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Finish File 04 Future18 inherited QA compatibility cleanup"
          git push origin HEAD:codex/file-04-future18-v200
