name: File04 R06 status proof patch
on:
  push:
    branches:
      - audit-file-04-eighty-round-2
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: audit-file-04-eighty-round-2
          fetch-depth: 0
      - run: |
          python3 tools/r06-status-proof-patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "80-round audit R06: authenticate dry-run and reconciliation status evidence"
          git push origin HEAD:audit-file-04-eighty-round-2
