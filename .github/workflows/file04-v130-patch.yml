name: File04 v130 one time patch

on:
  push:
    branches:
      - codex/file-04-central-plan-v130

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/file-04-central-plan-v130
          persist-credentials: true
      - run: test -f .github/file04-v130-patch.marker
      - run: python3 tools/apply-v130-source-patch.py
      - run: |
          rm -f .github/file04-v130-patch.marker .github/workflows/file04-v130-patch.yml tools/apply-v130-source-patch.py
          git config user.name "Sabri File 04 CI Reconciler"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Complete File 04 own-plan migration planning and canonical media identity guards"
          git push origin HEAD:codex/file-04-central-plan-v130
