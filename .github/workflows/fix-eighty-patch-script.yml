name: Fix eighty-round corrective driver syntax

on:
  push:
    branches:
      - audit-file-04-eighty-round-hardening

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: audit-file-04-eighty-round-hardening
          persist-credentials: true
      - name: Repair Python triple-quote boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -n 'capture_activation_handover' tools/apply-eighty-round-hardening.py
          sed -i 's/capture_activation_handover", """/capture_activation_handover""", """/' tools/apply-eighty-round-hardening.py
          python3 -m py_compile tools/apply-eighty-round-hardening.py
      - name: Commit syntax repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/apply-eighty-round-hardening.py
          git commit -m '80-round audit: repair corrective driver syntax'
          git push origin HEAD:audit-file-04-eighty-round-hardening
