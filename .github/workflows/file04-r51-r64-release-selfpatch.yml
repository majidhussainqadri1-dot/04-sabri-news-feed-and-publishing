name: File04 eighty-round R51-R64 isolated corrective patch

on:
  push:
    branches:
      - audit-file-04-eighty-release

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: audit-file-04-eighty-release
          persist-credentials: true
      - name: Apply R51-R64 and lint
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/apply-eighty-round-r51-r64.py
          python3 tools/apply-eighty-round-r51-r64.py
          find includes -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Commit corrected source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add includes
          git commit -m 'File 04 v2.0.4: correct defects from 80-round audit R51-R64'
          git push origin HEAD:audit-file-04-eighty-release
