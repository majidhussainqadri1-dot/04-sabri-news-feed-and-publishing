name: Bootstrap File 04 Canonical Source

on:
  push:
    branches:
      - codex/file-04-legacy-adapter-v1
    paths:
      - 'tools/bootstrap-parts/**'
      - '.github/workflows/bootstrap-file04-source.yml'

permissions:
  contents: write

jobs:
  expand-canonical-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout corrective branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Verify and stage canonical source
        shell: bash
        run: |
          set -euo pipefail
          cat tools/bootstrap-parts/part-* | base64 -d > /tmp/file04-source.tar.gz
          actual="$(sha256sum /tmp/file04-source.tar.gz | awk '{print $1}')"
          expected="9f74b00ad909007a32694a31161f5216435734c2fd8c27caeb45886288ef94b6"
          test "$actual" = "$expected"

          mkdir -p /tmp/file04-source
          tar -xzf /tmp/file04-source.tar.gz -C /tmp/file04-source

          cp -a .github/workflows /tmp/file04-original-workflows
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          find /tmp/file04-source -mindepth 1 -maxdepth 1 ! -name .github -exec cp -a {} . \;

          rm -rf .github/workflows
          mkdir -p .github/workflows
          cp /tmp/file04-source/.github/workflows/file04-legacy-adapter-ci.yml .github/workflows/file04-legacy-adapter-ci.yml

      - name: Verify exact canonical source
        shell: bash
        run: |
          set -euo pipefail
          find . -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/run-unit.php
          php tests/run-architecture.php
          python3 tools/build-release.py --verify-only

      - name: Restore unchanged workflow files and commit source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/workflows
          cp -a /tmp/file04-original-workflows .github/workflows

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No source changes to commit.'; exit 0; }
          git commit -m 'Replace File 04 with canonical legacy adapter v1.0.0'
          git push origin HEAD:codex/file-04-legacy-adapter-v1
