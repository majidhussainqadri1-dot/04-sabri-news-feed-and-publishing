name: File04 round9 builder patch
on:
  push:
    branches:
      - audit/file-04-second-ten-round-hardening
permissions:
  contents: write
jobs:
  patch-builder:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: audit/file-04-second-ten-round-hardening
          fetch-depth: 0
      - name: Patch builder
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/build-release.py')
          s=p.read_text()
          s=s.replace("VERSION='2.0.1'","VERSION='2.0.2'",1)
          s=s.replace("2.0.1.zip","2.0.2.zip")
          s=s.replace("2.0.1-complete-source.zip","2.0.2-complete-source.zip")
          if 'SECOND_TEN_ROUND_REVIEW_ROUNDS=10' not in s:
              s=s.replace('TEN_ROUND_REVIEW_ROUNDS=10\nHISTORICAL_REVIEW_ROUNDS=40','TEN_ROUND_REVIEW_ROUNDS=10\nSECOND_TEN_ROUND_REVIEW_ROUNDS=10\nHISTORICAL_REVIEW_ROUNDS=40',1)
          second_gate="subprocess.run([sys.executable,str(ROOT/'tests/run-second-ten-round-hardening.py')],check=True,cwd=ROOT,stdout=subprocess.DEVNULL)"
          if second_gate not in s:
              anchor="subprocess.run([sys.executable,str(ROOT/'tests/run-ten-round-post-future18.py')],check=True,cwd=ROOT,stdout=subprocess.DEVNULL)"
              s=s.replace(anchor,anchor+'\n    '+second_gate,1)
          if "'second_ten_round_hardening'" not in s:
              anchor="'post_future18_hardening':{'version':'1.0.0','review_rounds':TEN_ROUND_REVIEW_ROUNDS,'gate':'tests/run-ten-round-post-future18.py','scope':'authorization, REST failures, visual/redirect/DR evidence, receipt authenticity, release consistency'},"
              addition=anchor+"\n          'second_ten_round_hardening':{'version':'1.0.0','review_rounds':SECOND_TEN_ROUND_REVIEW_ROUNDS,'gate':'tests/run-second-ten-round-hardening.py','audit':'SECOND-TEN-ROUND-HARDENING-AUDIT.md','scope':'second fresh fail-closed/security/reliability review'},"
              s=s.replace(anchor,addition,1)
          s=s.replace("'coded':'v2.0.1 post-Future18 hardened candidate'","'coded':'v2.0.2 second-ten-round hardened candidate'")
          s=s.replace("'coded':'v2.0.2 post-Future18 hardened candidate'","'coded':'v2.0.2 second-ten-round hardened candidate'")
          # expose second-audit count in every release-evidence object that already reports the first ten rounds
          s=s.replace("'ten_round_post_future18_review_rounds':TEN_ROUND_REVIEW_ROUNDS,\n", "'ten_round_post_future18_review_rounds':TEN_ROUND_REVIEW_ROUNDS,\n          'second_ten_round_review_rounds':SECOND_TEN_ROUND_REVIEW_ROUNDS,\n")
          s=s.replace("{'name':'sabri:post-future18-hardening','value':'ten-round-v1'}", "{'name':'sabri:post-future18-hardening','value':'two-ten-round-audits-v2'}")
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/build-release.py
          git diff --cached --quiet && exit 0
          git commit -m "Review 9 fix: bind deterministic builder to v2.0.2 second audit"
          git push origin HEAD:audit/file-04-second-ten-round-hardening
