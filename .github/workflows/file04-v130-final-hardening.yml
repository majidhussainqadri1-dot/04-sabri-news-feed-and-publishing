name: File04 v130 final bounded-media hardening

on:
  push:
    branches:
      - codex/file-04-central-plan-v130

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/file-04-central-plan-v130
          persist-credentials: true
      - run: test -f tools/apply-v130-final-hardening.py
      - run: python3 tools/apply-v130-final-hardening.py
      - run: |
          rm -f .github/workflows/file04-v130-final-hardening.yml tools/apply-v130-final-hardening.py
          git config user.name "Sabri File 04 CI Reconciler"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Bound File 04 media traversal and correct storage estimation"
          git push origin HEAD:codex/file-04-central-plan-v130
