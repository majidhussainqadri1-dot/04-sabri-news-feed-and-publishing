name: Baseline Integrity

on:
  pull_request:
  push:
    branches:
      - baseline/file-04-original-import

permissions:
  contents: read

jobs:
  exact-source-inventory:
    if: github.ref_name == 'baseline/file-04-original-import' || github.head_ref == 'baseline/file-04-original-import'
    name: Exact source inventory
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout immutable action
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Verify canonical baseline
        run: |
          python3 - <<'PYVERIFY'
          from pathlib import Path
          import hashlib,json,re,sys
          root=Path('.')
          def fail(m): print('ERROR:',m);sys.exit(1)
          b=(root/'BASELINE-LOCK.json').read_bytes()
          if hashlib.sha256(b).hexdigest()!='e6038fca2a91586083be92236355464dd8d2dbd2a87122571a9a2a02f341cd2d': fail('baseline lock mismatch')
          lock=json.loads(b.decode())
          lines=(root/'SOURCE-INVENTORY.tsv').read_text().splitlines()
          if not lines or lines[0]!='sha256\tbytes\tpath': fail('inventory header')
          rows=[(a,int(b),c) for a,b,c in (line.split('\t',2) for line in lines[1:])]
          excluded={'README.md','SOURCE-PROVENANCE.md','STATUS.md','MANIFEST.md','SOURCE-INVENTORY.tsv','CHECKSUMS.sha256','BASELINE-LOCK.json','.github/workflows/baseline-integrity.yml'}
          expected={p for _,_,p in rows};actual={p.as_posix() for p in root.rglob('*') if p.is_file() and '.git/' not in p.as_posix() and p.as_posix() not in excluded}
          if actual!=expected: fail(f'inventory mismatch missing={sorted(expected-actual)} unexpected={sorted(actual-expected)}')
          total=php=0;canonical=[];checks=[]
          for h,s,p in rows:
            data=(root/p).read_bytes();actual_h=hashlib.sha256(data).hexdigest()
            if len(data)!=s or actual_h!=h: fail('source mismatch '+p)
            total+=s;php+=p.endswith('.php');canonical.append(f'{h}\t{s}\t{p}\n');checks.append(f'{h}  {p}\n')
          tree=hashlib.sha256(''.join(canonical).encode()).hexdigest()
          if total!=lock['source_size'] or php!=lock['php_file_count'] or tree!=lock['source_tree_sha256']: fail('baseline aggregate mismatch')
          if (root/'CHECKSUMS.sha256').read_text()!=''.join(checks): fail('baseline checksums mismatch')
          print('Baseline integrity verification passed.')
          PYVERIFY

  php-lint:
    if: github.ref_name == 'baseline/file-04-original-import' || github.head_ref == 'baseline/file-04-original-import'
    name: PHP lint (${{ matrix.php }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4','8.3']
    steps:
      - name: Checkout immutable action
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Set up PHP from immutable action
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint exact PHP source inventory
        run: awk -F '\t' 'NR>1 && $3 ~ /\.php$/ {print $3}' SOURCE-INVENTORY.tsv | while IFS= read -r file; do php -l "$file"; done
