name: Baseline Integrity

on:
  pull_request:
    paths-ignore: []
  push:
    branches:
      - baseline/file-04-original-import

permissions:
  contents: read

jobs:
  exact-source-inventory:
    name: Exact source inventory
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout immutable action
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Verify canonical baseline
        env:
          EXPECTED_LOCK_SHA256: e6038fca2a91586083be92236355464dd8d2dbd2a87122571a9a2a02f341cd2d
        run: |
          python3 - <<'PYVERIFY'
          from pathlib import Path
          import hashlib, json, re, sys
          root=Path('.')
          def fail(m):
              print('ERROR:',m); sys.exit(1)
          lock_path=root/'BASELINE-LOCK.json'
          if hashlib.sha256(lock_path.read_bytes()).hexdigest()!=Path('/dev/stdin').name and False:
              pass
          lock_bytes=lock_path.read_bytes()
          if hashlib.sha256(lock_bytes).hexdigest()!='e6038fca2a91586083be92236355464dd8d2dbd2a87122571a9a2a02f341cd2d': fail('baseline lock SHA-256 mismatch')
          lock=json.loads(lock_bytes.decode('utf-8'))
          rows=[]
          lines=(root/'SOURCE-INVENTORY.tsv').read_text(encoding='utf-8').splitlines()
          if not lines or lines[0]!='sha256\tbytes\tpath': fail('inventory header mismatch')
          for line in lines[1:]:
              h,s,p=line.split('\t',2); rows.append((h,int(s),p))
          if len(rows)!=lock['source_file_count']: fail('source file count mismatch')
          expected={p for _,_,p in rows}
          excluded={'README.md','SOURCE-PROVENANCE.md','STATUS.md','MANIFEST.md','SOURCE-INVENTORY.tsv','CHECKSUMS.sha256','BASELINE-LOCK.json','.github/workflows/baseline-integrity.yml'}
          actual={p.as_posix() for p in root.rglob('*') if p.is_file() and '.git/' not in p.as_posix() and p.as_posix() not in excluded}
          if actual!=expected:
              fail(f'inventory mismatch missing={sorted(expected-actual)} unexpected={sorted(actual-expected)}')
          total=0; php=0; canonical=[]; checksum_lines=[]
          for h,s,p in rows:
              b=(root/p).read_bytes(); ah=hashlib.sha256(b).hexdigest()
              if len(b)!=s: fail(f'size mismatch for {p}: {len(b)}')
              if ah!=h: fail(f'SHA-256 mismatch for {p}')
              total+=s; php+=p.endswith('.php'); canonical.append(f'{h}\t{s}\t{p}\n'); checksum_lines.append(f'{h}  {p}\n')
          if total!=lock['source_size']: fail('source size mismatch')
          if php!=lock['php_file_count']: fail('PHP count mismatch')
          tree=hashlib.sha256(''.join(canonical).encode()).hexdigest()
          if tree!=lock['source_tree_sha256']: fail(f'source-tree SHA-256 mismatch: {tree}')
          if (root/'CHECKSUMS.sha256').read_text(encoding='utf-8')!=''.join(checksum_lines): fail('checksums mismatch')
          main=(root/'sabri-news-publishing.php').read_text(encoding='utf-8')
          readme=(root/'readme.txt').read_text(encoding='utf-8')
          v=lock['plugin_version']
          if f'Version: {v}' not in main: fail('plugin header version mismatch')
          if f"define( 'SNP_VERSION', '{v}' );" not in main: fail('SNP_VERSION mismatch')
          if f'Stable tag: {v}' not in readme: fail('stable tag mismatch')
          forbidden_ext={'.zip','.tar','.gz','.7z','.sql','.sqlite','.bak'}
          for p in root.rglob('*'):
              if p.is_file() and p.suffix.lower() in forbidden_ext: fail(f'forbidden archive/database file: {p}')
          forbidden_names={'.env','wp-config.php','id_rsa','id_ed25519'}
          for p in root.rglob('*'):
              if p.is_file() and p.name in forbidden_names: fail(f'forbidden credential file: {p}')
          patterns={
            'private key':rb'-----BEGIN (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----',
            'Google API key':rb'\bAIza[0-9A-Za-z_-]{35}\b',
            'GitHub token':rb'\bgh[pousr]_[A-Za-z0-9]{20,}\b',
            'AWS access key':rb'\bAKIA[0-9A-Z]{16}\b',
            'JWT-like token':rb'\beyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\b'
          }
          for p in root.rglob('*'):
              if p.is_file() and '.git/' not in p.as_posix():
                  b=p.read_bytes()
                  for label,pat in patterns.items():
                      if re.search(pat,b): fail(f'possible {label} in {p}')
          wf=(root/'.github/workflows/baseline-integrity.yml').read_text(encoding='utf-8')
          if re.search(r'uses:\s+[^\s]+@(v\d+|main|master)\b',wf): fail('mutable action tag detected')
          print('Baseline integrity verification passed.')
          print('Source files:',len(rows)); print('PHP files:',php); print('Source bytes:',total); print('Source-tree SHA-256:',tree)
          PYVERIFY

  php-lint:
    name: PHP lint (${{ matrix.php }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4','8.3']
    steps:
      - name: Checkout immutable action
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Set up PHP from immutable action
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint exact PHP source inventory
        run: |
          awk -F '\t' 'NR>1 && $3 ~ /\.php$/ {print $3}' SOURCE-INVENTORY.tsv | while IFS= read -r file; do php -l "$file"; done
